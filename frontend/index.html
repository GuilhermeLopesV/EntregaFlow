<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Acesse sua conta EntregaFlow para acompanhar suas entregas."
    />
    <title>Entrar | EntregaFlow</title>
    <link rel="stylesheet" href="pages/css/style.css" />
    <script src="js/main.js" defer></script>
  </head>
  <body>
    <main class="login-page">
      <section class="login-card" aria-labelledby="login-title">
        <a class="brand" href="#" aria-label="EntregaFlow, início">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" fill="none">
              <path
                d="M5 10.5 16 4l11 6.5v11L16 28 5 21.5v-11Z"
                stroke="currentColor"
                stroke-width="2"
                stroke-linejoin="round"
              />
              <path
                d="m11 16 3.2 3.2L21.5 12"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </span>
          <span class="brand-name">Entrega<span>Flow</span></span>
        </a>

        <div class="intro">
          <p class="eyebrow">BEM-VINDO DE VOLTA</p>
          <h1 id="login-title">Acesse sua conta</h1>
          <p class="intro-copy">
            Entre para acompanhar suas entregas e manter tudo em movimento.
          </p>
        </div>

        <form class="login-form" id="login-form">
          <label for="email">E-mail</label>
          <div class="input-wrap">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none">
              <rect x="3" y="5" width="18" height="14" rx="2" />
              <path d="m4 7 8 6 8-6" />
            </svg>
            <input
              id="email"
              name="email"
              type="email"
              placeholder="voce@empresa.com"
              autocomplete="username"
              required
            />
          </div>

          <div class="password-label">
            <label for="password">Senha</label>
          </div>
          <div class="input-wrap">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none">
              <rect x="4" y="10" width="16" height="11" rx="2" />
              <path d="M8 10V7a4 4 0 0 1 8 0v3" />
            </svg>
            <input
              id="password"
              name="password"
              type="password"
              placeholder="Digite sua senha"
              autocomplete="current-password"
              required
            />
            <button
              class="password-toggle"
              id="password-toggle"
              type="button"
              aria-label="Mostrar senha"
              aria-pressed="false"
            >
              Mostrar
            </button>
          </div>

          <button class="submit-button" type="submit">
            Entrar
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none">
              <path d="M5 12h14m-6-6 6 6-6 6" />
            </svg>
          </button>
          <p class="form-message" id="form-message" role="status" aria-live="polite"></p>
        </form>

        <p class="security-note">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none">
            <path d="M12 3 19 6v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6l7-3Z" />
            <path d="m9 12 2 2 4-4" />
          </svg>
          Seus dados estão protegidos
        </p>
      </section>
      <footer class="page-footer">EntregaFlow · Gestão simples, entregas no prazo.</footer>
    </main>
  </body>
</html>
